# pnpm 供应链策略：拒绝安装发布不足 24 小时的新版本依赖。
# 该值此前来自 pnpm 12 的内置默认值（不写在仓库里），导致 CI 的 Docker 构建
# 会因「某个依赖刚发布」而间歇性失败（ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION），
# 且失败原因不可见、不可审查。这里显式固定为当前生效值 1440 分钟，
# 行为不变，但策略变成可 review 的仓库配置，也不再随 pnpm 版本默认值漂移。
# 降低该值等于放宽供应链保护，必须单独评审并说明理由。
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # 例外必须逐条给出理由，不要用通配符放宽整类依赖。
  # vite@8.3.4 为构建工具链必需版本，发布当日即需要用于 Vite 8 升级验证。
  - vite@8.3.4
