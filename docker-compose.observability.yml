services:
  grok2api:
    expose:
      - "9090"

  prometheus:
    image: "${GROK2API_PROMETHEUS_IMAGE:-prom/prometheus:v3.5.0}"
    profiles: ["observability"]
    depends_on:
      grok2api:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${GROK2API_PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${GROK2API_PROMETHEUS_PORT:-9091}:9090"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  grafana:
    image: "${GROK2API_GRAFANA_IMAGE:-grafana/grafana:12.1.1}"
    profiles: ["observability"]
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: "${GROK2API_GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GROK2API_GRAFANA_ADMIN_PASSWORD:-change-me-before-exposure}"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GROK2API_GRAFANA_PORT:-3000}:3000"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  prometheus-data:
  grafana-data:
