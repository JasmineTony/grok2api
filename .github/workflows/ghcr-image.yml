name: GHCR Image
# 触发说明：push 到 main 或推送 v*.*.* tag 时构建并发布多架构镜像。

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ghcr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    # PostgreSQL / Redis 闆嗘垚娴嬭瘯蹇呴』鏈夌湡瀹炴湇鍔★紝鍚﹀垯鐩稿叧骞跺彂銆侀攣涓庤处鏈笉鍙橀噺娌℃湁璇佹嵁銆?    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: grok2api
          POSTGRES_PASSWORD: grok2api
          POSTGRES_DB: grok2api
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grok2api"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # 浠呮寚鍚戞湰 job 鐨勯殧绂?service container锛涙祴璇曠敤 TestMain 浼氭寜闇€鍒涘缓骞跺洖鏀朵复鏃舵暟鎹簱銆?      TEST_POSTGRES_ADMIN_DSN: postgres://grok2api:grok2api@127.0.0.1:5432/grok2api?sslmode=disable
      TEST_REDIS_ADDRESS: 127.0.0.1:6379
      # 浣跨敤鐙珛 DB 搴忓彿锛岄伩鍏嶄笌鍏跺畠鐢ㄩ€斿叡鐢ㄩ粯璁ゅ簱銆?      TEST_REDIS_DATABASE: "9"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # AGENTS.md 搂8锛歏ERSION 鏄敮涓€鏉冨▉鐗堟湰婧愶紝frontend/package.json 蹇呴』涓庝箣澶勪簬鍚屼竴鏉＄増鏈嚎銆?      - name: Verify version carriers are aligned
        run: |
          set -euo pipefail
          version_file=$(tr -d '[:space:]' < VERSION)
          package_version=$(jq -r .version frontend/package.json)
          if [ "$version_file" != "v$package_version" ]; then
            echo "鐗堟湰杞戒綋涓嶄竴鑷达紙AGENTS.md 搂8锛夛細VERSION=$version_file锛宖rontend/package.json=$package_version"
            exit 1
          fi
          echo "鐗堟湰杞戒綋涓€鑷达細$version_file"

      - name: Test backend
        working-directory: backend
        run: go test ./... -count=1 -json > "$RUNNER_TEMP/backend-test.json"

      - name: Assert required integration tests ran
        run: |
          # 鎸夌敤渚嬪悕鍖归厤澶栭儴渚濊禆闆嗘垚娴嬭瘯锛圥ostgres/Redis锛夛紱鎸夊寘璺緞鍖归厤浼氭紡鎺?          # internal/application/account 涓殑 Redis 鐢ㄤ緥銆?          skipped=$(jq -r 'select(.Action == "skip" and .Test != null) | "\(.Package) \(.Test)"' "$RUNNER_TEMP/backend-test.json" \
            | grep -E 'Postgres|Redis' || true)
          if [ -n "$skipped" ]; then
            echo "蹇呴渶闆嗘垚鐢ㄤ緥琚烦杩囷紙鏈嶅姟涓嶅彲杈炬垨鐜鍙橀噺缂哄け锛夛紝涓嶅緱璁颁负閫氳繃锛?
            echo "$skipped"
            exit 1
          fi

      - name: Race backend
        working-directory: backend
        run: go test -race ./... -count=1

      - name: Vet backend
        working-directory: backend
        run: go vet ./...

      - name: Verify Swagger document
        run: |
          make swagger
          git diff --exit-code -- backend/docs/docs.go backend/docs/swagger.json backend/docs/swagger.yaml

      - name: Upload backend test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: ${{ runner.temp }}/backend-test.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # 浠撳簱鏍规病鏈?package.json锛宎ction 鏃犳硶浠?packageManager 鑷姩璇诲彇鐗堟湰锛岄渶涓?frontend/package.json 淇濇寔涓€鑷?          version: 12.10.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # pnpm verify 瑕嗙洊鏍煎紡銆佺被鍨嬨€丱xlint銆丒SLint銆佷緷璧栬竟鐣屻€佺粨鏋勭害鏉熴€侀棬绂佽嚜娴嬨€佽鐩栫巼銆佺敓浜ф瀯寤轰笌浣撶Н棰勭畻銆?      - name: Verify frontend
        working-directory: frontend
        run: pnpm verify

      - name: Install Playwright browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      # 鐪熷疄鍏ㄦ爤 E2E锛氱敓浜?dist + 鐪熷疄 Go 鏈嶅姟锛堜复鏃?SQLite/Memory锛夛紝姣?worker 鐙珛杩涚▼涓庝复鏃剁洰褰曘€?      - name: Run full-stack E2E
        working-directory: frontend
        run: pnpm test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: frontend/.artifacts/playwright
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore
          retention-days: 7

  check_ghcr_image:
    name: Build image (${{ matrix.arch }})
    if: github.event_name != 'push'
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          cache-from: type=gha,scope=${{ matrix.arch }}
          provenance: false
          sbom: false

  build_ghcr_image:
    name: Publish image (${{ matrix.arch }})
    if: github.event_name == 'push'
    needs: verify
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Normalize image name
        id: image
        shell: bash
        run: |
          image_name=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/$image_name" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          # 鍚?merge 姝ラ锛氬叧闂嚜鍔?latest锛屽惁鍒?tag 鎺ㄩ€佹椂姣忎釜鏋舵瀯閮戒細鍚勮嚜鎺ㄩ€佷竴涓８ latest 鍗曟灦鏋勯暅鍍忋€?          flavor: latest=false
          tags: |
            type=ref,event=branch,suffix=-${{ matrix.arch }}
            type=ref,event=tag,suffix=-${{ matrix.arch }}
            type=raw,value=latest-${{ matrix.arch }},enable=${{ github.ref == 'refs/heads/main' }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
          provenance: mode=max
          sbom: true

  merge:
    name: Merge image
    if: github.event_name == 'push'
    needs:
      - build_ghcr_image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Normalize image name
        id: image
        shell: bash
        run: |
          image_name=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/$image_name" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          # 鍏抽棴 metadata-action 鐨勮嚜鍔?latest锛歠lavor=auto 浼氭妸 type=ref,event=tag 涓€寰嬫爣璁颁负 latest锛?          # 鑰岃嚜鍔?latest 鍙户鎵?flavor.prefix/suffix銆佷笉缁ф壙鏉＄洰绾?suffix锛屽洜姝?tag 鎺ㄩ€佹椂
          # per-arch 姝ラ浼氭帹閫佽８ latest锛堝崟鏋舵瀯锛夛紝涓?latest-amd64/arm64 鍙湪 main 鎺ㄩ€佹椂鐢熸垚锛?          # 浣?merge 姝ラ鍥犵己灏?latest-<arch> 婧愯€屽け璐ャ€俵atest 浠呯敱涓嬮潰鐨?type=raw 鍦?main 涓婃樉寮忎骇鐢熴€?          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list
        shell: bash
        run: |
          # fail-fast锛氱閬撶殑閫€鍑虹爜鍙弽鏄?while 寰幆鏈€鍚庝竴娆¤凯浠ｏ紱缂?set -e/pipefail 鏃讹紝
          # 鍓嶉潰鐨?imagetools create 澶辫触浼氳鍚庨潰鐨勬垚鍔熸帺鐩栵紝鐣欎笅闄堟棫鏍囩鍗存姤缁裤€?          set -euo pipefail
          jq -cr '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON" | while read -r tag; do
            docker buildx imagetools create \
              -t "$tag" \
              "${tag}-amd64" \
              "${tag}-arm64"
          done

      - name: Inspect image
        shell: bash
        run: |
          # 鏂█绱㈠紩鐪熺殑鍚袱涓钩鍙帮細鍗曟灦鏋勭储寮曟鍓嶄篃浼氱豢鑹查€氳繃锛屽彂甯冮獙鏀跺彧鑳介潬浜哄伐璇绘棩蹇椼€?          # main 鎺ㄩ€佹椂 version 涓?main銆乼ag 鎺ㄩ€佹椂涓?vX.Y.Z锛屼袱鑰呴兘鍙?metadata-action 鐨?version 杈撳嚭銆?          set -euo pipefail
          ref="${{ steps.image.outputs.name }}:${{ steps.meta.outputs.version }}"
          echo "妫€鏌?$ref"
          platforms=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' \
            | jq -r '.manifests[].platform | select(. != null) | .os + "/" + .architecture' | sort -u)
          echo "$platforms"
          for expected in linux/amd64 linux/arm64; do
            grep -qx "$expected" <<< "$platforms" || { echo "鍙戝竷楠屾敹澶辫触锛?ref 缂哄皯骞冲彴 $expected"; exit 1; }
          done
          echo "澶氭灦鏋勬柇瑷€閫氳繃锛歭inux/amd64 + linux/arm64"
